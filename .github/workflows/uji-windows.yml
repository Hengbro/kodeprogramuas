# Uji otomatis di Windows sungguhan: ZIP sekolah/guru diekstrak, dipasang dengan Pasang-E-Rapor-SD.exe, lalu aplikasinya dijalankan.
name: Uji ZIP & pemasang Windows
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['windows/**', 'scripts/build-windows.sh', 'scripts/buat-zip-uji.js', 'src/lib/zip.js', 'src/lib/segarkan-zip.js', '.github/workflows/uji-windows.yml']

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y nsis zip
      - run: npm ci
      - run: bash scripts/build-windows.sh
      - run: node scripts/buat-zip-uji.js dist/E-Rapor-SD-Windows.zip uji-sekolah.zip
      - uses: actions/upload-artifact@v4
        with: { name: zip-uji, path: uji-sekolah.zip, retention-days: 3 }

  uji-windows:
    needs: bangun
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: zip-uji, path: . }
      - name: Ekstrak ZIP ke jalur panjang seperti di Downloads pengguna
        shell: powershell
        run: |
          $tujuan = "C:\Users\runneradmin\Downloads\E-Rapor-SD-NEGERI-071116-SIWALAWA-10220010-GURU-finsen071116siw"
          Expand-Archive -Path uji-sekolah.zip -DestinationPath $tujuan -Force
          $folder = Join-Path $tujuan "E-Rapor-10220010-GURU"
          foreach ($f in @("app\server.js", "app\package.json", "node\node.exe", "Jalankan-Rapor.bat", "Pasang-E-Rapor-SD.exe", "data\kode-aktivasi.txt", "app\node_modules\better-sqlite3\build\Release\better_sqlite3.node")) {
            if (-not (Test-Path (Join-Path $folder $f))) { throw "Berkas tidak ada setelah ekstrak: $f" }
          }
          $terpanjang = (Get-ChildItem $folder -Recurse -File | ForEach-Object { $_.FullName.Length } | Measure-Object -Maximum).Maximum
          Write-Host "Jalur terpanjang setelah ekstrak: $terpanjang karakter (batas 260)"
          if ($terpanjang -gt 240) { throw "Jalur terlalu panjang: $terpanjang" }
          "FOLDER=$folder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Pasang dengan pemasang (diam-diam)
        shell: powershell
        run: |
          $p = Start-Process -FilePath (Join-Path $env:FOLDER "Pasang-E-Rapor-SD.exe") -ArgumentList "/S" -PassThru -Wait
          Write-Host "Kode keluar pemasang: $($p.ExitCode)"
          $inst = Join-Path $env:LOCALAPPDATA "E-Rapor-SD"
          foreach ($f in @("app\server.js", "app\views\aktivasi.ejs", "node\node.exe", "Jalankan-Rapor.bat", "e-rapor.ico", "data\kode-aktivasi.txt")) {
            if (-not (Test-Path (Join-Path $inst $f))) { Get-ChildItem $inst -Recurse -Depth 1 | Select-Object -First 40 | ForEach-Object { Write-Host $_.FullName }; throw "Hasil pemasangan tidak lengkap, tidak ada: $f" }
          }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\E-Rapor SD.lnk") -and -not (Test-Path "$env:PUBLIC\Desktop\E-Rapor SD.lnk")) { Write-Host "Peringatan: ikon desktop tidak ditemukan (mungkin lokasi desktop berbeda di runner)" }
          Write-Host "Pemasangan lengkap di $inst"
      - name: Jalankan aplikasi dan periksa halamannya
        shell: powershell
        run: |
          $inst = Join-Path $env:LOCALAPPDATA "E-Rapor-SD"
          $env:OPEN_BROWSER = "0"
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$inst\Jalankan-Rapor.bat`"" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:3210/sehat" -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          Get-Content "$env:RUNNER_TEMP\out.txt" -ErrorAction SilentlyContinue | Select-Object -Last 15
          Get-Content "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 15
          if (-not $ok) { throw "Aplikasi tidak menyala di http://127.0.0.1:3210" }
          $a = Invoke-WebRequest -Uri "http://127.0.0.1:3210/aktivasi" -UseBasicParsing -TimeoutSec 10
          if ($a.StatusCode -ne 200 -or $a.Content -notmatch "Aktivasi") { throw "Halaman aktivasi tidak tampil" }
          Write-Host "OK: aplikasi menyala dan halaman aktivasi tampil di Windows"
