# Uji otomatis di Windows sungguhan, meniru pengguna: ZIP sekolah diekstrak di Downloads, dipasang dengan Pasang-E-Rapor-SD.exe,
# aplikasi dibuka dan admin login. Lalu username & sandi "diganti di server", ZIP baru dipasang di laptop yang sama,
# dan login harus berhasil dengan akun baru (data lama tidak ditimpa).
name: Uji ZIP & pemasang Windows
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['windows/**', 'scripts/build-windows.sh', 'scripts/buat-zip-uji.js', 'src/lib/zip.js', 'src/lib/segarkan-zip.js', 'src/lib/paket.js', 'src/lib/paket-otomatis.js', 'src/routes/aktivasi.js', 'src/routes/auth.js', '.github/workflows/uji-windows.yml']

jobs:
  bangun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update && sudo apt-get install -y nsis zip
      - run: npm ci
      - run: bash scripts/build-windows.sh
      - run: node scripts/buat-zip-uji.js dist/E-Rapor-SD-Windows.zip uji
      - uses: actions/upload-artifact@v4
        with: { name: zip-uji, path: uji/, retention-days: 3 }

  uji-windows:
    needs: bangun
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: zip-uji, path: uji }
      - name: Siapkan fungsi uji
        shell: powershell
        run: |
          @'
          function Ekstrak($zip, $tujuan) {
            Expand-Archive -Path $zip -DestinationPath $tujuan -Force
            $folder = Join-Path $tujuan "E-Rapor-10220010"
            foreach ($f in @("app\server.js", "node\node.exe", "Jalankan-Rapor.bat", "Pasang-E-Rapor-SD.exe", "data\kode-aktivasi.txt", "data\paket-awal.rapor.json", "app\node_modules\better-sqlite3\build\Release\better_sqlite3.node")) {
              if (-not (Test-Path (Join-Path $folder $f))) { throw "Berkas tidak ada setelah ekstrak: $f" }
            }
            $p = (Get-ChildItem $folder -Recurse -File | ForEach-Object { $_.FullName.Length } | Measure-Object -Maximum).Maximum
            Write-Host "Jalur terpanjang: $p karakter (batas 260)"; if ($p -gt 240) { throw "Jalur terlalu panjang: $p" }
            return $folder
          }
          function Pasang($folder) {
            $p = Start-Process -FilePath (Join-Path $folder "Pasang-E-Rapor-SD.exe") -ArgumentList "/S" -PassThru -Wait
            Write-Host "Kode keluar pemasang: $($p.ExitCode)"
            $inst = Join-Path $env:LOCALAPPDATA "E-Rapor-SD"
            foreach ($f in @("app\server.js", "app\views\aktivasi.ejs", "node\node.exe", "Jalankan-Rapor.bat")) { if (-not (Test-Path (Join-Path $inst $f))) { throw "Pemasangan tidak lengkap: $f" } }
          }
          function Nyalakan() {
            $env:LISENSI_PUBLIK = (Resolve-Path "uji\publik.pem").Path
            $inst = Join-Path $env:LOCALAPPDATA "E-Rapor-SD"
            Start-Process -FilePath "cmd.exe" -ArgumentList "/c `"$inst\Jalankan-Rapor.bat`"" -RedirectStandardOutput "$env:RUNNER_TEMP\out-$(Get-Random).txt" | Out-Null
            for ($i = 0; $i -lt 40; $i++) { Start-Sleep -Seconds 2; try { if ((Invoke-WebRequest "http://127.0.0.1:3210/sehat" -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200) { return } } catch { } }
            throw "Aplikasi tidak menyala"
          }
          function Matikan() { Get-Process node -ErrorAction SilentlyContinue | Stop-Process -Force; Start-Sleep -Seconds 2 }
          function Masuk($u, $p) {
            $r = Invoke-WebRequest "http://127.0.0.1:3210/login" -UseBasicParsing -SessionVariable s
            $t = [regex]::Match($r.Content, 'name="_csrf" value="([^"]+)"').Groups[1].Value
            if (-not $t) { throw "Halaman login tidak tampil (mungkin diarahkan ke aktivasi): $($r.BaseResponse.ResponseUri)" }
            # Windows PowerShell melempar galat untuk 401 (login ditolak): itu berarti "tidak berhasil masuk", bukan kegagalan uji
            try {
              $r2 = Invoke-WebRequest "http://127.0.0.1:3210/login" -Method Post -Body @{ _csrf = $t; username = $u; password = $p } -WebSession $s -UseBasicParsing
              Write-Host "Masuk $u -> $($r2.BaseResponse.ResponseUri.AbsolutePath)"
              return ($r2.Content -match 'Dasbor')
            } catch {
              $resp = $_.Exception.Response
              if ($resp -and [int]$resp.StatusCode -eq 401) { Write-Host "Masuk $u -> ditolak (401)"; return $false }
              throw
            }
          }
          '@ | Out-File -FilePath fungsi.ps1 -Encoding utf8
      - name: 1) Pasang ZIP pertama, admin masuk dengan akun dari server
        shell: powershell
        run: |
          . .\fungsi.ps1
          $f = Ekstrak "uji\uji-1.zip" "C:\Users\runneradmin\Downloads\E-Rapor-SD-NEGERI-071116-SIWALAWA-10220010"
          Pasang $f; Nyalakan
          if (-not (Masuk "admin.uji@sekolah" "Sandi-Satu-1")) { throw "Admin tidak bisa masuk dengan akun dari server" }
          if (Masuk "admin.uji@sekolah" "salah") { throw "Sandi salah malah diterima" }
          Write-Host "OK: admin masuk dengan username bertanda @ dan sandi dari server"
          Matikan
      - name: 2) Username & sandi diganti di server, ZIP baru dipasang di laptop yang sama
        shell: powershell
        run: |
          . .\fungsi.ps1
          $f = Ekstrak "uji\uji-2.zip" "C:\Users\runneradmin\Downloads\E-Rapor-SD-NEGERI-071116-SIWALAWA-10220010 (1)"
          Pasang $f; Nyalakan
          if (-not (Masuk "admin.baru@sekolah" "Sandi-Dua-2")) { throw "Akun baru dari server tidak berlaku setelah pasang ulang" }
          if (Masuk "admin.uji@sekolah" "Sandi-Satu-1") { throw "Akun lama masih bisa masuk" }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA "E-Rapor-SD\data\rapor.sqlite"))) { throw "Database lama hilang" }
          Write-Host "OK: setelah pasang ulang, username & sandi baru berlaku; database lama tetap ada"
          Matikan
